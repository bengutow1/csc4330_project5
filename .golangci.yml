# golangci-lint v2. Defaults (govet, staticcheck, errcheck, ineffassign,
# unused) plus two cheap linters that enforce doctrines the code comments
# promise: sloglint (structured logging stays structured) and noctx (no
# context-free HTTP/SQL calls — everything cancels when the request does).
version: "2"

linters:
  enable:
    - sloglint
    - noctx

  exclusions:
    rules:
      # httptest.NewRequest in tests is idiomatic — noctx is about production
      # HTTP/SQL calls that must cancel with their request, not fixtures.
      - path: _test\.go
        linters: [noctx]
