# Configures all projects within the workspace to create a project graph.
# Accepts a list of globs, a mapping of projects to relative file paths,
# or both values.
projects: ["packages/*/*", "apps/*", "scripts/*", "db", "docker", "proto"]

# Solo monorepo: don't police cross-layer project dependencies. This also lets
# the `db` project be depended on by libraries and apps alike, so a migration
# change marks every consumer as affected.
constraints:
  enforceLayerRelationships: false

# Configures the version control system (VCS). Also known as
# source code management (SCM).
vcs:
  # The default branch / base.
  defaultBranch: "main"

  # The upstream version control provider, where the repository
  # source code is stored.
  # @since 1.8.0
  # @values "bitbucket" | "github" | "gitlab" | "other"
  provider: "github"
  sync: true
  hooks:
    pre-commit:
      - 'moon run :format :lint --affected --status=staged'
      - 'gitleaks protect --staged --redact --no-banner'   # block committed secrets
    commit-msg:
      - 'cog verify --file $ARG1'        # enforce conventional commit format
