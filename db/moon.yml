$schema: 'https://moonrepo.dev/schemas/project.json'

# Owns the schema for the whole repo: one linear goose stream in migrations/. The Postgres it
# targets belongs to the `docker` project. `language: bash` keeps the Go and TypeScript tasks
# from being inherited here.
layer: 'tool'
language: 'bash'

project:
  name: 'db'
  description: 'The schema: one linear goose migration stream that every environment and every test runs.'

# goose reads these. The DSN opens the local database from docker/compose.yml, whose credentials
# are local-only defaults, not secrets; apps/api/moon.yml uses the same ones.
env:
  GOOSE_DRIVER: 'postgres'
  GOOSE_DBSTRING: 'postgres://fries:fries@localhost:5432/fries?sslmode=disable'
  GOOSE_MIGRATION_DIR: 'migrations'

tasks:
  # Apply every pending migration, starting Postgres first.
  migrate:
    command: 'goose up'
    deps: ['docker:up']
    options: { cache: false, runInCI: false }
  # Wipe the local database and migrate it from nothing. Goose tracks versions, not content, so
  # this is how an edited migration that already ran gets applied. DESTRUCTIVE, local only.
  fresh:
    command: 'goose up'
    deps: ['docker:reset']
    options: { cache: false, runInCI: false }
  # Roll back the most recent migration.
  rollback:
    command: 'goose down'
    options: { cache: false, runInCI: false }
  status:
    command: 'goose status'
    options: { cache: false, runInCI: false }
  # Fill the local database with the demo week (scripts/seed): fifteen players, their scans, plates
  # and fry runs, and a clear Fridge of the Week. A database that already holds the demo is left
  # alone, so run db:fresh first to lay it down again. Local only: never in CI, at boot or from a
  # migration.
  seed:
    command: 'go -C ../scripts/seed run .'
    deps: ['db:migrate']
    env:
      # The same local database api:dev opens, and the same local-only credentials.
      DATABASE_URL: 'postgres://fries:fries@localhost:5432/fries?sslmode=disable'
      LOG_FORMAT: 'text'
      # scripts/seed is kept out of go.work (tooling.md).
      GOWORK: 'off'
    options: { cache: false, runInCI: false }
  # Scaffold the next migration in sequence:  moon run db:create -- add_scans sql
  create:
    command: 'goose -s create'
    options: { cache: false, runInCI: false }
