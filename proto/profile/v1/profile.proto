// profile.v1: who the caller is in the game, for the Me tab, and the public card of any player,
// for the board. The server works out every number: all-time points from the ledger, the rank they
// earn, the stats and every badge, earned or locked. The caller's plates come back a page at a
// time, newest first, each with its photo.
syntax = "proto3";

package profile.v1;

import "cook/v1/cook.proto";
import "google/protobuf/timestamp.proto";

// ProfileService serves the caller's own profile, and any player's public card. Every rpc needs a
// signed-in account in the session.
service ProfileService {
  // GetProfile returns the caller's rank, stats and badges.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // ListPlates returns a page of the caller's plates, newest first.
  rpc ListPlates(ListPlatesRequest) returns (ListPlatesResponse);
  // GetPlayerCard returns one player's public card, found by their handle: how they got where
  // they are on the board, and never their kitchen settings.
  rpc GetPlayerCard(GetPlayerCardRequest) returns (GetPlayerCardResponse);
}

message GetProfileRequest {}

message GetProfileResponse {
  Profile profile = 1;
}

// Profile is the caller as the Me tab shows them.
message Profile {
  string handle = 1;
  // One emoji.
  string avatar = 2;
  // All-time points: the sum of the caller's ledger.
  int64 points = 3;
  // The title those points earn, and how far to the next.
  cook.v1.Rank rank = 4;
  Stats stats = 5;
  // Every badge, earned or locked, in the concept's order.
  repeated cook.v1.Badge badges = 6;
}

// Stats is the row of counts under the rank.
message Stats {
  // Checked plates, all time.
  int32 cooks = 1;
  // Days in a row with a checked plate, ending today; 0 until today has one.
  int32 streak_days = 2;
  // Fry runs logged, all time.
  int32 fry_runs = 3;
  // The share of meals that were fry runs, fry_runs / (fry_runs + cooks), from 0 to 1; 0 when
  // there are neither.
  double fry_ratio = 4;
  // The best score any of the caller's scans earned, 0 to 100; 0 before the first scan.
  int32 best_score = 5;
}

message ListPlatesRequest {
  // The next_cursor of the page before; "" for the first page.
  string cursor = 1;
  // The most plates on this page, from 1 to 24, where more is clamped to 24; 0 = 12.
  int32 limit = 2;
}

message ListPlatesResponse {
  // This page of the caller's plates, newest first.
  repeated Plate plates = 1;
  // Send as cursor for the next page; "" when this page is the last.
  string next_cursor = 2;
}

// Plate is one checked plate on the profile's grid.
message Plate {
  int64 plate_id = 1;
  // The JPEG as it was checked: at most 640 px on its long edge, so the grid draws it as it is.
  bytes photo = 2;
  // The recipe it was plated from.
  string recipe_title = 3;
  google.protobuf.Timestamp plated_at = 4;
}

message GetPlayerCardRequest {
  // The player's handle as the board shows it: 3 to 20 lowercase letters, digits and underscores.
  string handle = 1;
}

message GetPlayerCardResponse {
  PlayerCard card = 1;
}

// PlayerCard is what any signed-in player may see of another. It holds nothing from their
// kitchen settings: no equipment, diet, allergies, staples or roast level. A test fails if a field
// of that kind is ever added here.
message PlayerCard {
  string handle = 1;
  // One emoji.
  string avatar = 2;
  // All-time points: the sum of their ledger.
  int64 points = 3;
  // The title those points earn, and how far to the next.
  cook.v1.Rank rank = 4;
  Stats stats = 5;
  // Their newest plates, newest first: at most 6, one card's worth, so the list has no cursor.
  repeated Plate recent_plates = 6;
  // Every badge, earned or locked, in the concept's order.
  repeated cook.v1.Badge badges = 7;
}
