version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/apps/*"
      - "/packages/*/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dependencies:
        update-types: ["major", "minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    # The Expo SDK pins React, React Native and every native module to versions built together, and
    # CI never compiles the native app, so a bump past the SDK passes CI and breaks the build on a
    # phone. These move as one, on purpose, with `pnpm exec expo install --fix` in apps/mobile.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@types/react"
    groups:
      dependencies:
        update-types: ["major", "minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dependencies:
        update-types: ["major", "minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
