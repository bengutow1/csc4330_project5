version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/apps/*"
      - "/packages/*/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dependencies:
        update-types: ["major", "minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dependencies:
        update-types: ["major", "minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dependencies:
        update-types: ["major", "minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
