name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand from the Actions tab: checks every project, affected or not.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # proto resolves plugins AND their releases through the GitHub API.
      # Unauthenticated that is 60 requests an hour PER IP, shared by every
      # GitHub-hosted runner. The built-in token raises the ceiling to 1000/hr and
      # grants nothing beyond this job's own read-only permissions.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                    # moon ci + cog check need full history
      - uses: moonrepo/setup-toolchain@v0   # proto + moon, auto-cached
        with:
          # PROTO IS PINNED, and it is the one thing .prototools cannot pin:
          # it is the installer that reads that file. Left blank the action
          # takes whatever proto shipped today, so CI drifts from every dev
          # machine on its own schedule (0.60.1 changed the plugin ABI and broke
          # a plugin overnight in the sibling repos).
          #
          # Raise this deliberately, after `proto install` succeeds locally on
          # the new version.
          proto-version: ${{ vars.PROTO_VERSION || '0.57.4' }}
          auto-install: true                # install every tool pinned in .prototools
      - run: gitleaks git . --redact --no-banner   # secret scan
      - run: cog check                             # conventional commit enforcement
      # Build, lint and test the affected projects. A pull request compares against its base. A
      # push compares against the tip before it, so every commit it brings counts, not just the
      # last. A push with no earlier tip to compare against (a new branch sends all zeros) runs
      # everything, and so does a manual run, by counting every tracked file as changed. Not
      # `--force`: it makes moon's cache write-only, and then moon skips `pnpm install`, so every
      # TypeScript task fails for want of its tools.
      - name: moon ci
        # Naming bash adds pipefail, which the default shell lacks. Without it, a failed
        # `git ls-files` would hand moon an empty list, and moon would check the last commit only.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            git ls-files | moon ci --stdin
          elif [ "$EVENT" != "push" ]; then
            moon ci
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            moon ci --base "$BEFORE"
          else
            git ls-files | moon ci --stdin
          fi
