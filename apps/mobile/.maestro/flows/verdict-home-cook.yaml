# A home cook's verdict: the score, its tier, the roast, what was spotted and the cook buttons.
# Start the api with VISION_MOCK=home_cook (VISION_MOCK=home_cook moon run api:dev). Needs the app
# installed (moon run mobile:ios) and Metro (moon run mobile:dev).
appId: com.cadenlund.friesinthebag
---
- launchApp:
    clearState: true
- runFlow: subflows/sign-up.yaml
- runFlow: subflows/judge-sample.yaml
- assertVisible: "79"
- assertVisible: "Home Cook tier"
- assertVisible: "“There's a real dinner in here. Go find it.”"
- assertVisible: "Ground beef, 1 lb"
- assertVisible: "Show me what I can cook"
- assertVisible: "Nah, fries"
