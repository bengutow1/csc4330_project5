# A certified chef's verdict: the score, its tier, the roast, what was spotted and the cook
# buttons. Start the api with VISION_MOCK=certified_chef (VISION_MOCK=certified_chef moon run
# api:dev). Needs the app installed (moon run mobile:ios) and Metro (moon run mobile:dev).
appId: com.cadenlund.friesinthebag
---
- launchApp:
    clearState: true
- runFlow: subflows/sign-up.yaml
- runFlow: subflows/judge-sample.yaml
- assertVisible: "91"
- assertVisible: "Certified Chef tier"
- assertVisible: "“Fresh veggies, real protein, labeled leftovers. Your fridge has its life together.”"
- assertVisible: "Chicken, x2"
- assertVisible: "Show me what I can cook"
- assertVisible: "Nah, fries"
