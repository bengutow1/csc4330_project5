# Makes a new device account through onboarding, for any flow that needs a player signed in: the
# welcome, a fresh handle, then the kitchen saved as it opens. Run it right after a clean launch.
# It lives in a subfolder so a folder run of flows/ does not run it on its own.
appId: com.cadenlund.friesinthebag
---
- tapOn: "Get started"
- tapOn: "Handle"
# A fresh handle each run: the database keeps every account an earlier run made.
- inputText: "test_"
- inputRandomNumber:
    length: 8
- tapOn: "Next"
- assertVisible: "Your kitchen"
- tapOn: "Save my kitchen"
- assertVisible: "Coming in #18."
