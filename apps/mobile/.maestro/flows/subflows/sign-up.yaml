# Makes a new device account through the plain handle screen, for any flow that needs a player
# signed in. Run it right after a clean launch. It lives in a subfolder so a folder run of flows/
# does not run it on its own.
appId: com.cadenlund.friesinthebag
---
- assertVisible: "Pick a handle"
- tapOn: "Handle"
# A fresh handle each run: the database keeps every account an earlier run made.
- inputText: "test_"
- inputRandomNumber:
    length: 8
- tapOn: "Start cooking"
- assertVisible: "Coming in #18."
