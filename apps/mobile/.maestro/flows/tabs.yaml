# A signed-in player starts on Snap, and each tab switches to its own screen. Assertions use each
# placeholder's issue line, because the tab labels stay visible whichever tab is open. Needs the
# app installed (moon run mobile:ios), Metro (moon run mobile:dev) and the api (moon run api:dev).
appId: com.cadenlund.friesinthebag
---
- launchApp:
    clearState: true
- runFlow: subflows/sign-up.yaml
- assertVisible: "Coming in #18."
- tapOn: "Board"
- assertVisible: "Coming in #29."
- tapOn: "Me"
- assertVisible: "Coming in #30."
- tapOn: "Snap"
- assertVisible: "Coming in #18."
