# A scrappy verdict: the cook button carries the Scrappy bonus. Start the api with
# VISION_MOCK=scrappy (VISION_MOCK=scrappy moon run api:dev). Needs the app installed (moon run
# mobile:ios) and Metro (moon run mobile:dev).
appId: com.cadenlund.friesinthebag
---
- launchApp:
    clearState: true
- runFlow: subflows/sign-up.yaml
- runFlow: subflows/judge-sample.yaml
- assertVisible: "39"
- assertVisible: "Scrappy tier"
- assertVisible: "“It's giving creative. We can work with this.”"
- assertVisible: "Instant ramen, x3"
- assertVisible: "Show me what I can cook \\(\\+50\\)"
- assertVisible: "Nah, fries"
