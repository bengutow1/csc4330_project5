# Fixing a verdict's list: take one ingredient out, add another from the suggestions, save, and
# the score stays put. Start the api with VISION_MOCK=certified_chef (VISION_MOCK=certified_chef
# moon run api:dev). Needs the app installed (moon run mobile:ios) and Metro (moon run mobile:dev).
appId: com.cadenlund.friesinthebag
---
- launchApp:
    clearState: true
- runFlow: subflows/sign-up.yaml
- runFlow: subflows/judge-sample.yaml
- assertVisible: "Eggs, x12"
- scrollUntilVisible:
    element: "Fix the list"
- tapOn: "Fix the list"
- assertVisible: "Fixing the list changes your recipes, not your score."
- tapOn: "Remove Eggs"
- assertNotVisible: "Remove Eggs"
- tapOn: "Add an ingredient"
- inputText: "lem"
- tapOn: "Add Lemons"
- assertVisible: "Remove Lemons"
- tapOn: "Save"
- assertNotVisible: "Fixing the list changes your recipes, not your score."
- scrollUntilVisible:
    element: "Lemons"
- assertNotVisible: "Eggs, x12"
- scrollUntilVisible:
    element: "91"
    direction: UP
- assertVisible: "Certified Chef tier"
