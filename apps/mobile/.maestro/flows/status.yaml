# The status screen reaches the api through the shared data layer: route, screen, hook,
# transport, server and database. Needs the app installed (moon run mobile:ios) and the api
# running on :8080 (moon run api:dev).
appId: com.cadenlund.friesinthebag
---
- launchApp:
    clearState: true
- openLink: friesinthebag://status
# iOS asks before opening a link with our scheme; Android does not.
- tapOn:
    text: "Open"
    optional: true
- assertVisible: "Server ready"
- tapOn: "Check again"
- assertVisible: "Server ready"
