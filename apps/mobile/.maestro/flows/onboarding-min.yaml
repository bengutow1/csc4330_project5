# A fresh install has no session, so it opens on the plain handle screen. A malformed handle is
# refused under the input; a good one makes the device account and lands on the tabs, and the
# session cookie keeps the player signed in after they leave, the app is killed and they open it
# again. Needs the app installed (moon run mobile:ios), Metro (moon run mobile:dev) and the api
# (moon run api:dev).
appId: com.cadenlund.friesinthebag
---
- launchApp:
    clearState: true
- assertVisible: "Pick a handle"
- tapOn: "Handle"
- inputText: "x"
- tapOn: "Start cooking"
- assertVisible: "handle must be at least 3 characters"
- eraseText
- inputText: "test_"
- inputRandomNumber:
    length: 8
- tapOn: "Pick 🌮 as your avatar"
- tapOn: "Start cooking"
- assertVisible: "Coming in #18."
# Leave the app first, as a person does. iOS writes its cookies to disk lazily, so killing the app
# a second after sign-up, while it is still open, can lose a session no player would lose.
- pressKey: Home
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Coming in #18."
    timeout: 10000
- assertNotVisible: "Pick a handle"
- assertVisible: "Snap"
