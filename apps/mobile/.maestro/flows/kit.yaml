# The UI kit: every shared component, each one used, with the line under it asserted. Needs a
# development build of the app installed (moon run mobile:ios) and Metro running (moon run
# mobile:dev); a release build sends /kit home.
#
# Each section is scrolled to its lowest element (usually its result line) before it is used:
# scrollUntilVisible stops as soon as its target shows, so a control above that point and the
# line it writes are both on screen.
#
# A pretend write's pending label lasts only as long as the write, and Maestro's wait for the
# screen to settle after a tap can outlast it. So after a write the flow waits for the line the
# write leaves behind, never for its pending label.
appId: com.cadenlund.friesinthebag
---
- launchApp:
    clearState: true
- openLink: friesinthebag://kit
# iOS asks before opening a link with our scheme; Android does not.
- tapOn:
    text: "Open"
    optional: true
- assertVisible: "UI kit"

# Buttons: each press lands, and a pending button shows its ellipsis label.
- scrollUntilVisible:
    element: "Last pressed: nothing"
- tapOn: "Primary"
- assertVisible: "Last pressed: Primary"
- tapOn: "Destructive"
- assertVisible: "Last pressed: Destructive"
- assertVisible: "Judging…"
- tapOn: "Small secondary"
- assertVisible: "Last pressed: Small secondary"

# Pill toggle
- scrollUntilVisible:
    element: "Mode: Photo"
- tapOn: "Pantry"
- assertVisible: "Mode: Pantry"

# Filter chips: a second chip joins the first, and the first can be turned off.
- scrollUntilVisible:
    element: "Filters: Open now"
- tapOn: "Fast food"
- assertVisible: "Filters: Open now, Fast food"
- tapOn: "Open now"
- assertVisible: "Filters: Fast food"

# Ingredient chips: the cross removes its food, by its label.
- scrollUntilVisible:
    element: "Put them back"
- tapOn: "Remove Spinach"
- assertVisible: "Foods: Eggs, Cheddar"
- tapOn: "Put them back"
- assertVisible: "Foods: Eggs, Spinach, Cheddar"

# Segmented control and underline tabs
- scrollUntilVisible:
    element: "Board: Chefs"
- tapOn: "Hall of Fries"
- assertVisible: "Board: Hall of Fries"
- scrollUntilVisible:
    element: "Range: This week"
- tapOn: "All time"
- assertVisible: "Range: All time"

# Cards: a pressable card is one button, named for where it goes.
- scrollUntilVisible:
    element: "Card taps: 0"
- tapOn: "Open Taco Spot"
- assertVisible: "Card taps: 1"

# Header: the arrow and the cross each answer.
- scrollUntilVisible:
    element: "Header: nothing"
- tapOn: "Back"
- assertVisible: "Header: Back"
- tapOn: "Close"
- assertVisible: "Header: Close"
- assertVisible: "Leaderboard"

# Bottom bar: two actions share the width.
- scrollUntilVisible:
    element: "Bottom bar: nothing"
- tapOn: "Finish"
- assertVisible: "Bottom bar: Finish"

# Skeleton, empty state and error state
- scrollUntilVisible:
    element: "Loading skeleton"
- assertVisible: "Loading skeleton"
- scrollUntilVisible:
    element: "Empty state: nothing"
- assertVisible: "No plates yet"
- tapOn: "Snap your fridge"
- assertVisible: "Empty state: Snap your fridge"
- scrollUntilVisible:
    element: "Retries: 0"
- assertVisible: "Couldn't load the board"
- assertVisible: "Something went wrong. Try again."
- tapOn: "Try again"
- extendedWaitUntil:
    visible: "Retries: 1"
    timeout: 5000
- assertVisible: "Try again"

# Sheet: it opens over the kit and closes again.
- scrollUntilVisible:
    element: "Open the sheet"
- tapOn: "Open the sheet"
- assertVisible: "Mexican · \\$ · 2.9 km"
- tapOn: "Done"
- assertNotVisible: "Mexican · \\$ · 2.9 km"

# Confirm dialog: cancel keeps the data; confirming lands the delete.
- scrollUntilVisible:
    element: "Data: kept"
- tapOn: "Delete my data"
- assertVisible: "Delete your data\\?"
- tapOn: "Cancel"
- assertNotVisible: "Delete your data\\?"
- assertVisible: "Data: kept"
- tapOn: "Delete my data"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Data: deleted"
    timeout: 5000

# Logo, in both sizes
- scrollUntilVisible:
    element: "Fries in the Bag"
- assertVisible: "Fries in the Bag"

# Photo card and check pill
- scrollUntilVisible:
    element: "Tonight, 7:58 PM"
- assertVisible: "The logo's fries, standing in for a plate"
- scrollUntilVisible:
    element: "Looks like Creamy Tomato Pasta"
- assertVisible: "Looks like Creamy Tomato Pasta"

# Tier pills, one for each tier. Each says it is a tier, so the last is not the logo.
- scrollUntilVisible:
    element: "Fries in the Bag tier"
- assertVisible: "Certified Chef tier"
- assertVisible: "Home Cook tier"
- assertVisible: "Scrappy tier"

# Count up and the breakdown, each on its value. A screen reader hears only the value a count
# lands on, so these hold from the start; Play again then runs the motion once more.
- scrollUntilVisible:
    element: "Plays: 1"
- assertVisible: "79"
- assertVisible: "\\+140"
- assertVisible: "Home-cooked meal, \\+100"
- assertVisible: "4-day streak, \\+40"
- assertVisible: "Total, \\+140"
- tapOn: "Play again"
- extendedWaitUntil:
    visible: "Total, \\+140"
    timeout: 5000
- assertVisible: "Plays: 2"
